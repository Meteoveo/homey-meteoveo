<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.location.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.location.subtitle"></p>
</header>

<form class="homey-form">
  <div class="homey-form-group">
    <label class="homey-form-label" for="lat" data-i18n="pair.location.lat"></label>
    <input class="homey-form-input" id="lat" type="number" step="0.01" min="27" max="44.5" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="lon" data-i18n="pair.location.lon"></label>
    <input class="homey-form-input" id="lon" type="number" step="0.01" min="-18.5" max="4.6" />
  </div>
  <p class="mv-hint" data-i18n="pair.location.hint"></p>
  <button class="homey-button-primary-full" id="submit" data-i18n="pair.continue"></button>
</form>

<style>.mv-hint { font-size: 13px; opacity: .7; margin: 6px 0 16px; }</style>

<script type="text/javascript">
  const t = (key) => Homey.__(key);
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  Homey.emit('homey_location').then((here) => {
    if (!here) return;
    document.getElementById('lat').value = Number(here.lat).toFixed(2);
    document.getElementById('lon').value = Number(here.lon).toFixed(2);
  }).catch(() => {});

  let busy = false;
  document.querySelector('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    if (busy) return;
    busy = true;
    try { await submit(); } finally { busy = false; }
  });
  async function submit() {
    try {
      await Homey.emit('set_location', {
        lat: document.getElementById('lat').value,
        lon: document.getElementById('lon').value,
      });
      Homey.showView('station');
    } catch (err) {
      const key = 'errors.' + (err && err.message);
      const text = t(key);
      Homey.alert(text && text !== key ? text : t('errors.unknown'), 'error');
    }
  }
</script>
