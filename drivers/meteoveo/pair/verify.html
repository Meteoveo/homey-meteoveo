<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.verify.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.verify.subtitle"></p>
</header>

<form class="homey-form" onsubmit="return false">
  <div class="homey-form-group">
    <label class="homey-form-label" for="code" data-i18n="pair.verify.code"></label>
    <input class="homey-form-input" id="code" type="text" autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="one-time-code" />
  </div>
  <p class="mv-hint" data-i18n="pair.verify.hint"></p>
  <button class="homey-button-primary-full" id="submit" data-i18n="pair.continue"></button>
</form>

<style>.mv-hint { font-size: 13px; opacity: .7; margin: 6px 0 16px; }</style>

<script type="text/javascript">
  const t = (key) => Homey.__(key);
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.getElementById('submit').addEventListener('click', async () => {
    Homey.showLoadingOverlay();
    try {
      await Homey.emit('verify', { code: document.getElementById('code').value });
      Homey.showView('location');
    } catch (err) {
      const key = 'errors.' + (err && err.message);
      const text = t(key);
      Homey.alert(text && text !== key ? text : t('errors.unknown'), 'error');
    } finally {
      Homey.hideLoadingOverlay();
    }
  });
</script>
