<header class="homey-header">
  <h1 class="homey-title" data-i18n="repair.title"></h1>
</header>

<form class="homey-form">
  <fieldset class="homey-form-radio-set">
    <label class="homey-form-radio">
      <input class="homey-form-radio-input" type="radio" name="what" value="login" checked />
      <span class="homey-form-radio-checkmark"></span>
      <span class="homey-form-radio-text" data-i18n="repair.login"></span>
    </label>
    <label class="homey-form-radio">
      <input class="homey-form-radio-input" type="radio" name="what" value="location" />
      <span class="homey-form-radio-checkmark"></span>
      <span class="homey-form-radio-text" data-i18n="repair.location"></span>
    </label>
    <label class="homey-form-radio">
      <input class="homey-form-radio-input" type="radio" name="what" value="delete" />
      <span class="homey-form-radio-checkmark"></span>
      <span class="homey-form-radio-text" data-i18n="repair.delete"></span>
    </label>
  </fieldset>

  <div id="section-login">
    <p class="mv-hint" data-i18n="repair.login_hint"></p>
  </div>
  <div id="section-location" style="display:none">
    <div class="homey-form-group">
      <label class="homey-form-label" for="lat" data-i18n="pair.location.lat"></label>
      <input class="homey-form-input" id="lat" type="number" step="0.01" />
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="lon" data-i18n="pair.location.lon"></label>
      <input class="homey-form-input" id="lon" type="number" step="0.01" />
    </div>
  </div>
  <div id="section-delete" style="display:none">
    <p class="mv-warn" data-i18n="repair.delete_explain"></p>
    <p class="mv-hint"><a id="what-is-deleted" href="#" data-i18n="repair.delete_more"></a></p>
  </div>

  <div id="credentials">
    <div class="homey-form-group">
      <label class="homey-form-label" for="email" data-i18n="pair.account.email"></label>
      <input class="homey-form-input" id="email" type="email" autocomplete="email" />
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="password" data-i18n="pair.account.password"></label>
      <input class="homey-form-input" id="password" type="password" autocomplete="current-password" />
    </div>
  </div>
  <div class="homey-form-group" id="confirm-group" style="display:none">
    <label class="homey-form-label" for="confirm" data-i18n="repair.delete_confirm"></label>
    <input class="homey-form-input" id="confirm" type="email" autocomplete="off" />
  </div>

  <button class="homey-button-primary-full" id="submit"></button>
</form>

<style>
  .mv-hint { font-size: 13px; opacity: .7; margin: 6px 0 16px; }
  .mv-hint a { color: inherit; text-decoration: underline; }
  .mv-warn { font-size: 14px; margin: 6px 0 12px; }
</style>

<script type="text/javascript">
  const t = (key) => Homey.__(key);
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.getElementById('what-is-deleted').addEventListener('click', (e) => {
    e.preventDefault();
    Homey.openURL('https://www.meteoveo.com/legal/eliminar-cuenta');
  });
  const what = () => document.querySelector('input[name="what"]:checked').value;
  const button = document.getElementById('submit');

  function render() {
    const w = what();
    for (const s of ['login', 'location', 'delete']) document.getElementById('section-' + s).style.display = w === s ? '' : 'none';
    document.getElementById('credentials').style.display = w === 'location' ? 'none' : '';
    document.getElementById('confirm-group').style.display = w === 'delete' ? '' : 'none';
    button.textContent = t(w === 'delete' ? 'repair.delete_button' : 'pair.continue');
    button.classList.toggle('mv-danger', w === 'delete');
  }
  document.querySelectorAll('input[name="what"]').forEach((el) => el.addEventListener('change', render));
  render();

  Homey.emit('homey_location').then((here) => {
    if (!here) return;
    document.getElementById('lat').value = Number(here.lat).toFixed(2);
    document.getElementById('lon').value = Number(here.lon).toFixed(2);
  }).catch(() => {});

  let busy = false;
  document.querySelector('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    if (busy) return;
    busy = true;
    try { await submit(); } finally { busy = false; }
  });
  async function submit() {
    const w = what();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if (w === 'delete') {
      const sure = await Homey.confirm(t('repair.delete_last_chance'), 'warning');
      if (!sure) return;
    }
    Homey.showLoadingOverlay();
    try {
      if (w === 'login') await Homey.emit('login_again', { email, password });
      if (w === 'location') {
        await Homey.emit('set_location', { lat: document.getElementById('lat').value, lon: document.getElementById('lon').value });
      }
      if (w === 'delete') await Homey.emit('delete_account', { email, password, confirm: document.getElementById('confirm').value });
      Homey.done();
    } catch (err) {
      const key = 'errors.' + (err && err.message);
      const text = t(key);
      Homey.alert(text && text !== key ? text : t('errors.unknown'), 'error');
    } finally {
      Homey.hideLoadingOverlay();
    }
  }
</script>
