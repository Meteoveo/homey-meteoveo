<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { --mv-cobalt: #2b6fa8; --mv-sky: #7fb6cf; --mv-ochre: #dfa137; --mv-terracotta: #bd4a2b; }
    body { margin: 0; color: var(--homey-text-color); }
    .now { display: flex; align-items: baseline; gap: var(--homey-su-2); }
    .temp { font-size: var(--homey-font-size-xxlarge); line-height: var(--homey-line-height-xxlarge); font-weight: var(--homey-font-weight-medium); }
    .cond { color: var(--homey-text-color-light); }
    .place { margin-left: auto; color: var(--homey-text-color-light); font-size: var(--homey-font-size-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
    .headline { margin: var(--homey-su-2) 0 var(--homey-su-1); font-weight: var(--homey-font-weight-medium); }
    .bar { display: flex; gap: 2px; height: 28px; align-items: flex-end; }
    .bar span { flex: 1; border-radius: 2px; background: var(--homey-line-color-light); height: 4px; }
    .bar span.light { background: var(--mv-sky); height: 10px; }
    .bar span.moderate { background: var(--mv-cobalt); height: 18px; }
    .bar span.heavy { background: var(--mv-terracotta); height: 28px; }
    .bar span.model { opacity: .55; }
    .axis { display: flex; justify-content: space-between; font-size: var(--homey-font-size-small); color: var(--homey-text-color-light); margin-top: 2px; }
    .hours { display: flex; justify-content: space-between; margin-top: var(--homey-su-3); text-align: center; font-size: var(--homey-font-size-small); }
    .hours .t { font-weight: var(--homey-font-weight-medium); font-size: var(--homey-font-size-default); }
    .hours .p { color: var(--mv-cobalt); }
    .warn { margin-top: var(--homey-su-2); padding: var(--homey-su-1) var(--homey-su-2); border-radius: var(--homey-border-radius-small); font-size: var(--homey-font-size-small); }
    .warn.yellow { background: #f6e27a; color: #3a3000; }
    .warn.orange { background: var(--mv-ochre); color: #2b1a00; }
    .warn.red { background: var(--mv-terracotta); color: #fff; }
    .foot { margin-top: var(--homey-su-2); font-size: 11px; color: var(--homey-text-color-light); }
    .empty { padding: var(--homey-su-4) 0; text-align: center; color: var(--homey-text-color-light); }
  </style>
</head>
<body class="homey-widget">
  <div id="root"><div class="empty" id="msg"></div></div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const t = (key, vars) => Homey.__(key, vars);
      const root = document.getElementById('root');
      const setting = (Homey.getSettings() || {}).device;
      const deviceId = setting && setting.id ? setting.id : '';

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      }

      function hhmm(iso, tz) {
        return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz }).format(new Date(iso));
      }

      function headline(d) {
        const n = d.nextHour;
        if (!n) return t('widget.no_nowcast');
        if (n.rainNow && n.rainEndsAt) return t('widget.rain_until', { time: hhmm(n.rainEndsAt, d.timezone) });
        if (n.rainNow) return t('widget.rain_now');
        if (n.rainStartsAt) return t('widget.rain_from', { time: hhmm(n.rainStartsAt, d.timezone) });
        return t('widget.dry');
      }

      function render(d) {
        root.textContent = '';
        if (d.state !== 'ok') {
          root.append(el('div', 'empty', t('widget.' + d.state)));
          return;
        }
        const c = d.current || {};
        const now = el('div', 'now');
        now.append(
          el('span', 'temp', c.tempC === null || c.tempC === undefined ? '–' : Math.round(c.tempC) + '°'),
          el('span', 'cond', t('conditions.' + (c.iconKey || 'ismeretlen'))),
          el('span', 'place', d.place ? d.place.name : d.name),
        );
        root.append(now, el('div', 'headline', headline(d)));

        // By each step's own time: a response kept after a 304 is older than its leadMinutes say.
        const nowMs = Date.now();
        const steps = ((d.nextHour && d.nextHour.steps) || []).filter((s) => {
          const at = Date.parse(s.at);
          return at + 600000 > nowMs && at <= nowMs + 120 * 60000;
        });
        if (steps.length) {
          const bar = el('div', 'bar');
          for (const s of steps) bar.append(el('span', s.band + (s.source === 'model' ? ' model' : '')));
          const axis = el('div', 'axis');
          axis.append(el('span', '', t('widget.now')), el('span', '', '+1 h'), el('span', '', '+2 h'));
          root.append(bar, axis);
        }

        const hours = el('div', 'hours');
        for (const h of (d.hourly || []).slice(0, 6)) {
          const col = el('div');
          col.append(
            el('div', '', hhmm(h.at, d.timezone)),
            el('div', 't', h.tempC === null ? '–' : Math.round(h.tempC) + '°'),
            el('div', 'p', h.precipProbPct ? h.precipProbPct + '%' : ''),
          );
          hours.append(col);
        }
        root.append(hours);

        const order = { yellow: 1, orange: 2, red: 3 };
        const worst = (d.warnings || []).slice().sort((a, b) => (order[b.level] || 0) - (order[a.level] || 0))[0];
        if (worst) root.append(el('div', 'warn ' + worst.level, t('levels.' + worst.level) + ' · ' + (worst.phenomenonName || '')));

        // Age from the run time, not ageMinutes: after a 304 the kept response
        // would show the age it had when it was first fetched.
        const issued = d.nextHour ? Date.parse(d.nextHour.issuedAt) : NaN;
        const minutes = Number.isNaN(issued) ? (d.nextHour && d.nextHour.ageMinutes) : Math.max(0, Math.round((Date.now() - issued) / 60000));
        const age = d.nextHour && minutes != null ? t('widget.age', { minutes }) + ' · ' : '';
        root.append(el('div', 'foot', age + (d.attribution || '')));
      }

      async function load() {
        try {
          render(await Homey.api('GET', '/forecast?device=' + encodeURIComponent(deviceId)));
        } catch (err) {
          render({ state: 'unavailable' });
        }
      }

      load().finally(() => Homey.ready());
      setInterval(load, 60 * 1000);
    }
  </script>
</body>
</html>
