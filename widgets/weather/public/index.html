<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* MeteoVeo home-screen language (Inicio v3, "glass over the sky scene"):
       a sky photo for the current weather, white text on it, and translucent
       glass cards — the same tokens as the Android app (Glass.kt, Theme.kt). */
    :root {
      --mv-cobalt: #2b6fa8; --mv-sky: #7fb6cf; --mv-ochre: #dfa137; --mv-terracotta: #bd4a2b; --mv-ink: #12302b;
      --band-light: #5fbf98; --band-moderate: #f4d035; --band-heavy: #ef6c00;
      --card-radius: 20px; --pill-radius: 16px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    html, body { margin: 0; padding: 0; }
    body { font-family: var(--font); color: var(--homey-text-color, #222); -webkit-font-smoothing: antialiased; background: transparent; }
    /* Rounded like Homey's own widgets (the frame is transparent, so the corners are ours):
       Homey's radius token when the dashboard provides it, else 16 px as its phone widgets. */
    :root { --frame-radius: var(--homey-border-radius-default, 16px); }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .empty { padding: 28px 16px; text-align: center; color: var(--homey-text-color-light, #777); font-size: 15px; line-height: 1.4; background: var(--homey-background-color, #fff); border-radius: var(--frame-radius); }
    .empty strong { display: block; color: var(--homey-text-color, #222); font-size: 17px; margin-bottom: 4px; }

    /* The scene */
    /* Two schemes: white text on a dark background (the photo, dark colours, the dark dashboard)
       and ink on a light one. The page picks by the background's effective luminance. */
    .sky {
      --on-sky: #fff; --on-sky-2: rgba(255,255,255,.82); --on-sky-3: rgba(255,255,255,.62); --on-sky-4: rgba(255,255,255,.55);
      --surf-1: rgba(255,255,255,.08); --surf-2: rgba(255,255,255,.16); --surf-3: rgba(255,255,255,.28);
      --card-top: rgba(255,255,255,.15); --card-bot: rgba(255,255,255,.08); --glass-border: rgba(255,255,255,.18); --pill: rgba(255,255,255,.16);
      --solid: #fff; --solid-fg: var(--mv-ink); --point: #fff; --rain-pct: #84d4f2; --temp-line: #f4c08a; --warn-text: #ffd166;
      --text-shadow: 0 1px 2px rgba(0,0,0,.25); --icon-shadow: drop-shadow(0 2px 4px rgba(14,52,60,.34));
      position: relative; min-height: 100%; color: var(--on-sky); overflow: hidden; border-radius: var(--frame-radius); isolation: isolate; -webkit-mask-image: -webkit-radial-gradient(white, black);
    }
    .sky.ink {
      --on-sky: var(--mv-ink); --on-sky-2: rgba(18,48,43,.8); --on-sky-3: rgba(18,48,43,.62); --on-sky-4: rgba(18,48,43,.6);
      --surf-1: rgba(18,48,43,.06); --surf-2: rgba(18,48,43,.10); --surf-3: rgba(18,48,43,.18);
      --card-top: rgba(255,255,255,.62); --card-bot: rgba(255,255,255,.42); --glass-border: rgba(18,48,43,.16); --pill: rgba(18,48,43,.08);
      --solid: var(--mv-ink); --solid-fg: #fff; --point: #fff; --rain-pct: #2b6fa8; --temp-line: #bd4a2b; --warn-text: #8a5417;
      --text-shadow: none; --icon-shadow: drop-shadow(0 1px 2px rgba(18,48,43,.18));
    }
    /* The background layer: the photo (with its scrim) or a colour, at the chosen opacity; none when transparent. */
    .bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .bg.photo { background: #1d3350 center 45% / cover no-repeat; }
    .bg.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,20,34,.18) 0%, rgba(10,20,34,.42) 45%, rgba(10,20,34,.78) 100%); }
    .wrap { position: relative; z-index: 1; padding: 14px 14px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .wrap > * { min-width: 0; }

    /* Warning band: solid, never glass (the app: readability beats decoration) */
    .warn { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 10px 14px; border-radius: 14px; font-size: 14px; font-weight: 600; }
    .warn .ico { flex: none; width: 18px; height: 18px; }
    .warn .what { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* The time wraps under the phenomenon when both do not fit: the fact stays whole, the time right-aligned. */
    .warn .when { flex: 0 0 auto; margin-left: auto; font-weight: 500; opacity: .95; white-space: nowrap; }
    .warn.yellow { background: #f2ce1b; color: #3a2c00; } .warn.yellow .ico { fill: #3a2c00; }
    .warn.orange { background: #e07b17; color: #fff; } .warn.orange .ico { fill: #fff; }
    .warn.red { background: #c92a2a; color: #fff; } .warn.red .ico { fill: #fff; }
    .warn.none { background: var(--pill); border: 1px solid var(--pill); color: var(--on-sky-2); font-weight: 500; padding: 8px 14px; font-size: 13px; }
    .warn.none .ico { fill: var(--on-sky-3); width: 16px; height: 16px; }

    /* Hero */
    .hero { display: grid; gap: 10px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 7px; font-size: 13px; letter-spacing: -.02em; color: var(--on-sky-2); }
    .brand b { font-weight: 600; }
    .brand svg { width: 20px; height: 20px; }
    .basis { font-size: 11.5px; color: var(--on-sky-2); background: var(--pill); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
    .basis.measured::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5fbf98; margin-right: 6px; vertical-align: 1px; }
    .place { font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; margin-top: -4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: var(--text-shadow); }
    .now { display: flex; align-items: center; gap: 14px; margin-top: -6px; }
    .temp { font-size: 58px; font-weight: 300; line-height: 1; letter-spacing: -.03em; white-space: nowrap; text-shadow: var(--text-shadow); }
    .temp sup { font-size: 24px; font-weight: 400; vertical-align: top; line-height: 1.6; letter-spacing: 0; margin-left: 1px; }
    .hero-icon { flex: none; display: flex; align-items: center; filter: var(--icon-shadow); }
    .cond { min-width: 0; display: grid; gap: 1px; }
    .cond .name { font-size: 15px; font-weight: 600; line-height: 1.2; }
    .cond .mm { font-size: 12.5px; color: var(--on-sky-2); }
    .cond .mm b { color: var(--on-sky); font-weight: 600; }

    .pill { background: var(--pill); border: 1px solid var(--pill); border-radius: var(--pill-radius); padding: 9px 14px; }
    .metrics { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .metric { display: grid; gap: 1px; }
    .metric .l { font-family: var(--mono); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--on-sky-2); }
    .metric .v { font-size: 14px; font-weight: 600; white-space: nowrap; }

    /* Glass cards */
    .card { background: linear-gradient(180deg, var(--card-top), var(--card-bot)); border: 1px solid var(--glass-border); border-radius: var(--card-radius); padding: 12px 14px 12px; -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .card-head .title { font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; }
    .card-head .meta { font-size: 11px; color: var(--on-sky-3); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    /* Next hour */
    .headline { font-size: 13.5px; line-height: 1.35; margin: 4px 0 6px; color: var(--on-sky); }
    .headline.rain { font-weight: 600; }
    .bands { display: flex; gap: 3px; height: 26px; align-items: flex-end; margin-top: 2px; }
    .bands span { flex: 1; border-radius: 3px; background: var(--surf-2); height: 5px; }
    .bands span.light { background: var(--band-light); height: 11px; }
    .bands span.moderate { background: var(--band-moderate); height: 18px; }
    .bands span.heavy { background: var(--band-heavy); height: 26px; }
    .bands span.model { opacity: .55; }
    .bands span.uncertain { background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgba(0,0,0,.18) 3px 5px); }
    .axis { display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--mono); font-size: 9.5px; color: var(--on-sky-3); }

    /* Hours chart */
    .chart-wrap { margin-top: 4px; }
    .chart { display: block; width: 100%; height: auto; overflow: visible; }
    .chart text { font-family: var(--font); fill: var(--on-sky); }
    .chart .t { font-size: 12px; font-weight: 600; }
    .chart .h { font-size: 11px; fill: var(--on-sky-3); }

    /* The 0-3 h strip */
    .strip { margin-top: 6px; }
    .strip .icons { display: flex; height: 24px; align-items: flex-end; }
    .strip .icons span { flex: 1; display: flex; justify-content: center; filter: var(--icon-shadow); }
    .strip .s3 { display: block; width: 100%; height: auto; overflow: visible; }
    .strip .s3 text { font-family: var(--font); fill: var(--on-sky); }
    .strip .s3 .t { font-size: 11.5px; font-weight: 600; }
    .strip .s3 .h { font-size: 10.5px; fill: var(--on-sky-3); }
    .strip .s3 .w { font-size: 10px; fill: var(--on-sky-2); }
    .strip .s3 .arrow { fill: var(--on-sky-2); }

    /* Days */
    .days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin-top: 8px; text-align: center; }
    .day { display: grid; justify-items: center; gap: 4px; min-width: 0; }
    .day .n { font-size: 12px; color: var(--on-sky-2); white-space: nowrap; }
    .day.today .n { font-weight: 700; color: var(--on-sky); }
    .day .mx { font-size: 14px; font-weight: 600; }
    .day .mn { font-size: 12px; color: var(--on-sky-3); }
    .day .pp { font-size: 11px; font-weight: 600; color: var(--rain-pct); min-height: 13px; }
    .day .ic { filter: var(--icon-shadow); display: flex; }

    /* Footer: licence line + the quiet pencil */
    .foot { display: flex; align-items: flex-end; gap: 10px; }
    .foot .lic { flex: 1; min-width: 0; font-size: 9.5px; line-height: 1.35; color: var(--on-sky-4); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: left; cursor: pointer; }
    .foot .lic.open { display: block; -webkit-line-clamp: unset; overflow: visible; color: var(--on-sky-2); }
    .edit-btn { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--pill); border: 1px solid var(--pill); display: flex; align-items: center; justify-content: center; color: var(--on-sky-2); }
    .edit-btn svg { width: 15px; height: 15px; fill: currentColor; }
    .edit-btn:active { background: var(--surf-3); }

    /* Edit mode */
    .edit-head { display: grid; gap: 3px; }
    .edit-head .title { font-size: 17px; font-weight: 600; }
    .edit-head .hint { font-size: 12.5px; color: var(--on-sky-2); line-height: 1.35; }
    .rows { display: grid; gap: 6px; margin-top: 10px; position: relative; }
    .row { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 8px 8px 6px; border-radius: 14px; background: var(--surf-1); border: 1px solid var(--glass-border); user-select: none; -webkit-user-select: none; }
    .row.off .name { color: var(--on-sky-3); }
    .row.dragging { position: relative; z-index: 2; background: var(--surf-3); box-shadow: 0 10px 26px -10px rgba(0,0,0,.6); transform: scale(1.02); }
    .rows.has-drag .row:not(.dragging) { transition: transform .12s ease; }
    .handle { flex: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--on-sky-2); cursor: pointer; border-radius: 10px; background: none; border: 0; }
    .row.drop-target { outline: 1px dashed var(--on-sky-3); outline-offset: -1px; cursor: pointer; }
    .handle svg { width: 16px; height: 16px; fill: currentColor; }
    .row .name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arrows { flex: none; display: flex; gap: 2px; }
    .arrow { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--on-sky-2); background: var(--surf-1); }
    .arrow:disabled { opacity: .3; cursor: default; }
    .arrow svg { width: 14px; height: 14px; fill: currentColor; }
    .switch { flex: none; width: 42px; height: 26px; border-radius: 13px; background: var(--surf-3); position: relative; transition: background .15s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .switch[aria-checked="true"] { background: var(--mv-cobalt); }
    .switch[aria-checked="true"]::after { transform: translateX(16px); }
    .row.cond { flex-wrap: wrap; }
    .seg { flex: 0 0 calc(100% - 40px); box-sizing: border-box; display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--surf-2); margin: 2px 0 0 40px; }
    .seg button { flex: 1; min-width: 0; padding: 6px 4px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--on-sky-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg button[aria-pressed="true"] { background: var(--solid); color: var(--solid-fg); }
    .edit-msg { font-size: 12.5px; color: var(--warn-text); min-height: 16px; margin-top: 8px; }
    /* The background section of the editor */
    .bg-sec { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--glass-border); display: grid; gap: 8px; }
    .bg-sec .title { font-size: 14px; font-weight: 600; }
    .bg-sec .seg { flex: none; margin: 0; }
    .bg-sec .seg button { flex: 1 1 auto; padding: 6px 8px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--glass-border); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); position: relative; }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--solid), inset 0 0 0 1px rgba(255,255,255,.25); }
    .swatch.custom { background: conic-gradient(#f44, #fc0, #4c4, #0cc, #44f, #c4c, #f44); overflow: hidden; }
    .swatch.custom input { position: absolute; inset: -10px; width: 60px; height: 60px; opacity: 0; cursor: pointer; }
    .opacity { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--on-sky-2); }
    .opacity input { flex: 1; min-width: 0; accent-color: var(--mv-cobalt); }
    .opacity b { color: var(--on-sky); font-weight: 600; min-width: 42px; text-align: right; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .btn { padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; }
    .btn.ghost { background: var(--pill); border: 1px solid var(--pill); color: var(--on-sky); }
    .btn.primary { background: var(--solid); color: var(--solid-fg); }
    .btn:disabled { opacity: .5; cursor: default; }

    @media (min-width: 440px) {
      .wrap { padding: 16px 16px 14px; gap: 12px; }
      .place { font-size: 28px; }
      .temp { font-size: 66px; }
      .cond .name { font-size: 16px; }
      .day .mx { font-size: 15px; }
    }
  </style>
</head>

ill="#d3d4c3" opacity=".3"></path><path d="M80 65a17 17 0 0 1 19 17 22 22 0 0 0-19-17z" fill="#d3d4c3" opacity=".22"></path><path d="M22 95h76a11 11 0 0 1-11 9H33a11 11 0 0 1-11-9z" fill="#d3d4c3"></path><path d="M27 100h66a11 11 0 0 1-6 4H33a11 11 0 0 1-6-4z" fill="#d3d4c3" opacity=".6"></path><ellipse cx="52" cy="60" rx="15" ry="7.5" fill="url(#mvCloudGloss)"></ellipse><ellipse cx="31" cy="76" rx="7" ry="3.6" fill="#ffffff" opacity=".5"></ellipse><ellipse cx="85" cy="75" rx="7" ry="3.4" fill="#ffffff" opacity=".38"></ellipse><rect x="0" y="110" width="132" height="22" fill="#6c7f4b"></rect></g></svg>';

      }
      function html(tag, className, markup) {
        const node = el(tag, className);
        node.innerHTML = markup;
        return node;
      }

      const fmtNum = (v, digits) => new Intl.NumberFormat(locale, { minimumFractionDigits: 0, maximumFractionDigits: digits }).format(v);
      const deg = (v) => (v === null || v === undefined ? '—' : Math.round(v) + '°');
      const hhmm = (iso, tz) => new Intl.DateTimeFormat(locale, { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz }).format(new Date(iso));
      const hourOnly = (iso, tz) => new Intl.DateTimeFormat(locale, { hour: '2-digit', hour12: false, timeZone: tz }).format(new Date(iso)).replace(/\D.*$/, '');
      const weekday = (date, tz) => new Intl.DateTimeFormat(locale, { weekday: 'short', timeZone: tz }).format(new Date(date + 'T12:00:00Z')).replace(/\.$/, '');
      const localDate = (iso, tz) => new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: tz }).format(new Date(iso));
      const minutesAgo = (iso) => Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));

      /** The sky scene from the icon key (the web's sky-assets; the same rule as the app's sceneOf). */
      function sceneFor(d) {
        const c = d.current || {};
        const night = c.isDaylight === false;
        if (d.nextHour && d.nextHour.rainNow) return 'eso';
        switch (c.iconKey) {
          case 'napos': return night ? 'ejjel' : 'derult';
          case 'reszben_felhos': return night ? 'ejjel' : 'gomoly';
          case 'fatyolfelhos': return night ? 'ejjel' : 'fatyol';
          case 'borult': case 'kod': return 'borult';
          case 'eso': case 'zapor': case 'havazas': return 'eso';
          case 'szemerkel': return night ? 'eso' : 'gyengen';
          case 'zivatar': return 'zivatar';
          default: return night ? 'ejjel' : 'gomoly';
        }
      }

      function timeWords(iso, d, key, isFrom) {
        const today = localDate(new Date().toISOString(), d.timezone);
        const sameDay = localDate(iso, d.timezone) === today;
        const time = hhmm(iso, d.timezone);
        if (sameDay) return t(key, { time });
        const day = new Intl.DateTimeFormat(locale, { weekday: 'long', timeZone: d.timezone }).format(new Date(iso));
        return t(key + '_day', { time, day });
      }

      function headline(d) {
        const n = d.nextHour;
        if (!n) return { text: t('no_nowcast'), rain: false };
        if (minutesAgo(n.issuedAt) > 60) return { text: t('stale'), rain: false };
        if (n.rainNow && n.rainEndsAt) return { text: t('rain_until', { time: hhmm(n.rainEndsAt, d.timezone) }), rain: true };
        if (n.rainNow) return { text: t('rain_now'), rain: true };
        if (n.rainStartsAt) return { text: t('rain_from', { time: hhmm(n.rainStartsAt, d.timezone) }), rain: true };
        return { text: t('dry'), rain: false };
      }

      function leadLabel(atMs, nowMs) {
        const m = Math.max(0, Math.round((atMs - nowMs) / 60000 / 5) * 5);
        if (m === 0) return t('now');
        return m % 60 === 0 ? '+' + (m / 60) + ' h' : '+' + m + ' min';
      }

      // ---- Cards ----------------------------------------------------------

      function warningBand(d) {
        const order = { yellow: 1, orange: 2, red: 3 };
        const list = (d.warnings || []).filter((w) => order[w.level]);
        if (!list.length) return null;
        const nowMs = Date.now();
        // The current one first; otherwise the nearest upcoming one (the app's rule).
        const active = list.filter((w) => !w.onset || Date.parse(w.onset) <= nowMs);
        const pool = active.length ? active : list.slice().sort((a, b) => Date.parse(a.onset) - Date.parse(b.onset));
        const w = pool.slice().sort((a, b) => order[b.level] - order[a.level])[0];
        const band = html('div', 'warn ' + w.level, WARN_ICON);
        // The phenomenon is the AEMET source text (Spanish); the level is ours.
        band.append(el('span', 'what', (w.phenomenonName || w.headline || '') + ' · ' + t('levels.' + w.level)));
        let when = '';
        if (w.onset && Date.parse(w.onset) > nowMs) when = timeWords(w.onset, d, 'warn_from', true);
        else if (w.expires) when = timeWords(w.expires, d, 'warn_until', false);
        if (when) band.append(el('span', 'when', when));
        return band;
      }

      /** The 'always' warning card on a quiet day: says so, in the pill's voice, never in a colour. */
      function quietWarningBand() {
        const band = html('div', 'warn none', '<svg class="ico" viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.1-1.6-5.6-4.5-6.3V4a1.5 1.5 0 0 0-3 0v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>');
        band.append(el('span', 'what', t('no_warnings')));
        return band;
      }

      function heroCard(d) {
        const c = d.current || {};
        const hero = el('div', 'hero');
        const top = el('div', 'top');
        top.append(html('div', 'brand', LOGO + '<span>Meteo<b>Veo</b></span>'));
        let basis;
        if (c.basis === 'station' && c.at) {
          const m = minutesAgo(c.at);
          basis = el('span', 'basis measured', m <= 2 ? t('measured_now') : t('measured_ago', { minutes: m }));
        } else {
          basis = el('span', 'basis', t('model_now'));
        }
        top.append(basis);
        hero.append(top);
        hero.append(el('div', 'place', d.place && d.place.name ? d.place.name : d.name));

        const now = el('div', 'now');
        const temp = el('span', 'temp');
        if (c.tempC === null || c.tempC === undefined) temp.textContent = '—';
        else { temp.textContent = fmtNum(c.tempC, 1); temp.append(html('sup', '', '°')); }
        now.append(temp);
        now.append(html('span', 'hero-icon', weatherIconSvg(c.iconKey || 'ismeretlen', 60, c.isDaylight === false)));
        const cond = el('div', 'cond');
        cond.append(el('div', 'name', t('conditions.' + (c.iconKey || 'ismeretlen'))));
        const today = (d.daily || [])[0];
        if (today) {
          cond.append(html('div', 'mm', '<b>' + deg(today.tempMaxC) + '</b> ' + t('max')));
          cond.append(html('div', 'mm', '<b>' + deg(today.tempMinC) + '</b> ' + t('min')));
        }
        now.append(cond);
        hero.append(now);
        return hero;
      }

      function metricsCard(d) {
        const c = d.current || {};
        const metrics = [];
        if (c.humidityPct !== null && c.humidityPct !== undefined) metrics.push([t('humidity'), Math.round(c.humidityPct) + ' %']);
        // km/h, as in the app and at AEMET (the contract carries m/s).
        if (c.windMs !== null && c.windMs !== undefined) metrics.push([t('wind'), fmtNum(Math.round(c.windMs * 3.6), 0) + ' km/h']);
        if (c.gustMs !== null && c.gustMs !== undefined) metrics.push([t('gust'), fmtNum(Math.round(c.gustMs * 3.6), 0) + ' km/h']);
        if (c.pressureHpa !== null && c.pressureHpa !== undefined) metrics.push([t('pressure'), Math.round(c.pressureHpa) + ' hPa']);
        if (c.precipMm !== null && c.precipMm !== undefined) metrics.push([t('rain'), fmtNum(c.precipMm, 1) + ' mm']);
        if (!metrics.length) return null;
        const bar = el('div', 'pill metrics');
        for (const [l, v] of metrics.slice(0, 4)) {
          const m = el('div', 'metric');
          m.append(el('span', 'l', l), el('span', 'v', v));
          bar.append(m);
        }
        return bar;
      }

      function nextHourCard(d) {
        const card = el('div', 'card');
        const head = el('div', 'card-head');
        head.append(el('span', 'title', t('next_hour')));
        if (d.nextHour && d.nextHour.issuedAt) {
          // Age from the run time, not ageMinutes: a kept response would show the age it had when fetched.
          head.append(el('span', 'meta', 'MeteoVeo · ' + t('age', { minutes: minutesAgo(d.nextHour.issuedAt) })));
        }
        card.append(head);
        const h = headline(d);
        card.append(el('div', 'headline' + (h.rain ? ' rain' : ''), h.text));

        // By each step's own time: skip the steps already over, show up to two hours.
        const nowMs = Date.now();
        const steps = ((d.nextHour && d.nextHour.steps) || []).filter((s) => {
          const at = Date.parse(s.at);
          return at + STEP_MS > nowMs && at <= nowMs + 120 * 60000;
        });
        if (steps.length) {
          const bar = el('div', 'bands');
          for (const s of steps) {
            const band = s.band || 'none';
            bar.append(el('span', band + (s.source === 'model' ? ' model' : '') + (s.uncertain && band !== 'none' ? ' uncertain' : '')));
          }
          const axis = el('div', 'axis');
          axis.append(el('span', '', t('now')));
          if (steps.length >= 6) axis.append(el('span', '', leadLabel(Date.parse(steps[Math.floor(steps.length / 2)].at), nowMs)));
          if (steps.length >= 3) axis.append(el('span', '', leadLabel(Date.parse(steps[steps.length - 1].at), nowMs)));
          card.append(bar, axis);
        }
        return card;
      }

      function hoursCard(d, width) {
        const hours = (d.hourly || []).filter((h) => h.tempC !== null && h.tempC !== undefined);
        if (hours.length < 2) return null;
        const n = Math.max(6, Math.min(hours.length, Math.floor((width - 30) / 46)));
        const pts = hours.slice(0, n);
        const card = el('div', 'card');
        const head = el('div', 'card-head');
        head.append(el('span', 'title', t('hour_by_hour')), el('span', 'meta', '© AEMET'));
        card.append(head);

        const W = width - 30; const H = 100;
        const top = 22; const bottom = 60; // the temperature line lives here
        const temps = pts.map((h) => h.tempC);
        const lo = Math.min(...temps); const hi = Math.max(...temps);
        const span = Math.max(hi - lo, 3);
        const x = (i) => ((i + 0.5) * W) / n;
        const y = (v) => bottom - ((v - lo) / span) * (bottom - top);
        let svg = '';
        const line = pts.map((h, i) => x(i).toFixed(1) + ',' + y(h.tempC).toFixed(1)).join(' ');
        svg += `<polygon points="${x(0).toFixed(1)},${bottom + 6} ${line} ${x(n - 1).toFixed(1)},${bottom + 6}" fill="var(--surf-1)"/>`;
        svg += `<polyline points="${line}" fill="none" stroke="var(--temp-line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        pts.forEach((h, i) => {
          const cx = x(i); const cy = y(h.tempC);
          svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.4" fill="var(--point)" stroke="var(--temp-line)" stroke-width="1.5"/>`;
          svg += `<text class="t" x="${cx.toFixed(1)}" y="${(cy - 8).toFixed(1)}" text-anchor="middle">${Math.round(h.tempC)}°</text>`;
          const p = h.precipProbPct;
          if (p >= 10) {
            const bh = Math.max(3, Math.round((p / 100) * 14));
            svg += `<rect x="${(cx - 5).toFixed(1)}" y="${82 - bh}" width="10" height="${bh}" rx="2" fill="var(--rain-pct)"/>`;
          } else {
            svg += `<rect x="${(cx - 5).toFixed(1)}" y="80" width="10" height="2" rx="1" fill="var(--surf-2)"/>`;
          }
          svg += `<text class="h" x="${cx.toFixed(1)}" y="97" text-anchor="middle">${hourOnly(h.at, d.timezone)}</text>`;
        });
        card.append(html('div', 'chart-wrap', `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMidYMid meet">${svg}</svg>`));
        return card;
      }

      /** Our own 0-3 h forecast, 10-minute steps: sky, temperature line, rain bands, times, wind. */
      function nowcast3hCard(d, width) {
        const n = d.nextHour;
        if (!n) return null;
        const steps = liveSteps(d, 180);
        if (steps.length < 3) return null;
        const card = el('div', 'card');
        const head = el('div', 'card-head');
        head.append(el('span', 'title', t('nowcast3h')), el('span', 'meta', t('nowcast_meta') + ' · ' + t('age', { minutes: minutesAgo(n.issuedAt) })));
        card.append(head);

        const W = width - 30;
        const count = steps.length;
        const x = (i) => ((i + 0.5) * W) / count;
        const every = W >= 400 ? 2 : 3; // a label every 20 or 30 minutes
        const labelled = (i) => i % every === 0 && i <= count - 1 && (i < count - every + 1 || i === count - 1);
        const strip = el('div', 'strip');

        // Sky icons ONE PER HOUR, centred over that hour's steps: the step's icon is the
        // AEMET icon of its hour (ADR-0607 D1), not a 10-minute sky reading.
        const haveIcons = steps.some((s) => s.iconKey);
        if (haveIcons) {
          const icons = el('div', 'icons');
          const hourOf = (s) => localDate(s.at, d.timezone) + ' ' + hourOnly(s.at, d.timezone);
          const groups = [];
          steps.forEach((s, i) => {
            const key = hourOf(s);
            const g = groups[groups.length - 1];
            if (g && g.key === key) g.last = i; else groups.push({ key, first: i, last: i });
          });
          const at = new Map();
          for (const g of groups) {
            const mid = Math.floor((g.first + g.last) / 2);
            const s = steps[mid].iconKey ? steps[mid] : steps.slice(g.first, g.last + 1).find((x) => x.iconKey);
            if (s) at.set(mid, s);
          }
          steps.forEach((s, i) => {
            const cell = el('span');
            const icon = at.get(i);
            if (icon) cell.innerHTML = weatherIconSvg(icon.iconKey, 22, icon.isDaylight === false);
            icons.append(cell);
          });
          strip.append(icons);
        }

        const temps = steps.map((s) => s.tempC).filter((v) => v !== null && v !== undefined);
        const haveTemp = temps.length >= 2;
        const haveWind = steps.some((s) => s.windMs !== null && s.windMs !== undefined);
        const lineTop = 16; const lineBottom = haveTemp ? 50 : 8;
        const bandBase = lineBottom + 24; // the rain bands' baseline
        const timeY = bandBase + 15;
        const windY = timeY + 18;
        const H = haveWind ? windY + 6 : timeY + 4;
        let svg = '';
        if (haveTemp) {
          const lo = Math.min(...temps); const hi = Math.max(...temps);
          const span = Math.max(hi - lo, 2);
          const y = (v) => lineBottom - ((v - lo) / span) * (lineBottom - lineTop);
          const pts = steps.map((s, i) => (s.tempC === null || s.tempC === undefined ? null : [x(i), y(s.tempC)])).filter(Boolean);
          const line = pts.map(([px, py]) => px.toFixed(1) + ',' + py.toFixed(1)).join(' ');
          svg += `<polygon points="${pts[0][0].toFixed(1)},${lineBottom + 6} ${line} ${pts[pts.length - 1][0].toFixed(1)},${lineBottom + 6}" fill="var(--surf-1)"/>`;
          svg += `<polyline points="${line}" fill="none" stroke="var(--temp-line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
          steps.forEach((s, i) => {
            if (!labelled(i) || s.tempC === null || s.tempC === undefined) return;
            const cx = x(i); const cy = y(s.tempC);
            svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3" fill="var(--point)" stroke="var(--temp-line)" stroke-width="1.5"/>`;
            svg += `<text class="t" x="${cx.toFixed(1)}" y="${(cy - 7).toFixed(1)}" text-anchor="middle">${Math.round(s.tempC)}°</text>`;
          });
        }
        // Rain bands: every step, the next-hour card's colours and heights.
        const bandH = { light: 8, moderate: 13, heavy: 18 };
        const bw = Math.max(3, W / count - 2);
        steps.forEach((s, i) => {
          const band = s.band && s.band !== 'none' ? s.band : null;
          const h = band ? bandH[band] || 8 : 3;
          const fill = band ? `var(--band-${band})` : 'var(--surf-2)';
          const dim = s.source === 'model' ? ' opacity=".55"' : '';
          svg += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${bandBase - h}" width="${bw.toFixed(1)}" height="${h}" rx="2" fill="${fill}"${dim}/>`;
        });
        // Times on the labelled steps.
        steps.forEach((s, i) => {
          if (!labelled(i)) return;
          svg += `<text class="h" x="${x(i).toFixed(1)}" y="${timeY}" text-anchor="middle">${hhmm(s.at, d.timezone)}</text>`;
        });
        // Wind every hour: an arrow pointing where the wind goes, and km/h.
        if (haveWind) {
          steps.forEach((s, i) => {
            if (i % 6 !== 0 || s.windMs === null || s.windMs === undefined) return;
            const cx = x(i);
            if (s.windBearingDeg !== null && s.windBearingDeg !== undefined) {
              svg += `<path class="arrow" d="M0,-5 L3.5,4 L0,2 L-3.5,4 Z" transform="translate(${(cx - 13).toFixed(1)},${windY - 4}) rotate(${(s.windBearingDeg + 180) % 360})"/>`;
            }
            svg += `<text class="w" x="${(cx - 6).toFixed(1)}" y="${windY}" text-anchor="start">${Math.round(s.windMs * 3.6)} km/h</text>`;
          });
        }
        strip.append(html('div', 'chart-wrap', `<svg class="s3" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMidYMid meet">${svg}</svg>`));
        card.append(strip);
        return card;
      }

      function daysCard(d) {
        const days = (d.daily || []).filter((x) => !x.trend).slice(0, 7);
        if (!days.length) return null;
        const card = el('div', 'card');
        const head = el('div', 'card-head');
        head.append(el('span', 'title', t('seven_days')));
        card.append(head);
        const row = el('div', 'days');
        const today = localDate(new Date().toISOString(), d.timezone);
        days.forEach((day, i) => {
          const col = el('div', 'day' + (day.date === today || (i === 0 && day.date < today) ? ' today' : ''));
          col.append(el('span', 'n', day.date === today ? t('today') : weekday(day.date, d.timezone)));
          col.append(html('span', 'ic', weatherIconSvg(day.iconKey || 'ismeretlen', 28, false)));
          col.append(el('span', 'mx', deg(day.tempMaxC)));
          col.append(el('span', 'mn', deg(day.tempMinC)));
          // Like the app's day cells: a chance below 20 % is not a statement worth a number.
          col.append(el('span', 'pp', day.precipProbPct >= 20 ? day.precipProbPct + ' %' : ''));
          row.append(col);
        });
        card.append(row);
        return card;
      }

      // ---- Layout (order + always/auto/never), always a full, valid list ----

      function showOf(id, c) {
        let show = c.show;
        if (show === undefined && typeof c.on === 'boolean') show = c.on ? CARDS[id].default : 'never'; // pre-3-state layouts
        if (!SHOW_VALUES.includes(show)) show = CARDS[id].default;
        if (show === 'auto' && !CARDS[id].conditional) show = 'always';
        return show;
      }
      function normalizeColor(v) {
        if (typeof v !== 'string') return null;
        const c = v.trim().toLowerCase();
        if (/^#[0-9a-f]{6}$/.test(c)) return c;
        if (/^#[0-9a-f]{3}$/.test(c)) return '#' + c.slice(1).split('').map((x) => x + x).join('');
        return null;
      }
      function normalizeBackground(input) {
        const src = input && typeof input === 'object' ? input : {};
        const n = src.opacity === null || src.opacity === undefined || src.opacity === '' ? NaN : Number(src.opacity);
        return {
          mode: BACKGROUND_MODES.includes(src.mode) ? src.mode : DEFAULT_BACKGROUND.mode,
          color: normalizeColor(src.color) || DEFAULT_BACKGROUND.color,
          opacity: Number.isFinite(n) ? Math.min(100, Math.max(0, Math.round(n))) : DEFAULT_BACKGROUND.opacity,
        };
      }
      function normalizeLayout(input) {
        const raw = input && Array.isArray(input.cards) ? input.cards : [];
        const seen = new Set(); const cards = [];
        for (const c of raw.slice(0, 64)) {
          if (!c || typeof c.id !== 'string' || !CARDS[c.id] || seen.has(c.id)) continue;
          seen.add(c.id); cards.push({ id: c.id, show: showOf(c.id, c) });
        }
        for (const id of CARD_IDS) {
          if (seen.has(id)) continue;
          // A missing card goes after its nearest preceding default neighbour that is present (lib/widget-layout.js).
          const before = CARD_IDS.slice(0, CARD_IDS.indexOf(id)).reverse();
          const anchor = before.map((prev) => cards.findIndex((c) => c.id === prev)).find((at) => at >= 0);
          cards.splice(anchor === undefined ? 0 : anchor + 1, 0, { id, show: CARDS[id].default });
        }
        if (!cards.some((c) => c.show === 'always')) cards.find((c) => c.id === 'hero').show = 'always';
        return { cards, background: normalizeBackground(input && input.background) };
      }

      // ---- The background and the scheme it needs -----------------------------

      /** Relative luminance (0 dark .. 1 light) of a CSS colour: #rgb, #rrggbb or rgb()/rgba(); null if unreadable. */
      function luminanceOf(css) {
        const c = normalizeColor(css);
        let rgb = null;
        if (c) rgb = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
        else { const m = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(css || ''); if (m) rgb = [m[1], m[2], m[3]].map(Number); }
        if (!rgb) return null;
        const lin = rgb.map((v) => { const x = v / 255; return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; });
        return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
      }

      /** What the dashboard shows through: its background colour if it tells us, else its theme class, else the system. */
      function dashboardLuminance() {
        const v = getComputedStyle(document.body).getPropertyValue('--homey-background-color').trim();
        const l = v ? luminanceOf(v) : null;
        if (l !== null) return l;
        if (document.querySelector('.homey-dark-mode') || document.documentElement.classList.contains('homey-dark-mode')) return 0.02;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 0.02 : 1;
      }

      /** The photo under its scrim is dark: ~0.12. The rest is the colour, or the dashboard behind a translucent layer. */
      function effectiveLuminance(bg) {
        const a = bg.mode === 'transparent' ? 0 : bg.opacity / 100;
        const layer = bg.mode === 'color' ? luminanceOf(bg.color) : 0.12;
        return a * layer + (1 - a) * dashboardLuminance();
      }

      /** Paints the background layer of a `.sky` and picks the ink or the white scheme for it. */
      function paintBackground(sky, bg, sceneKey) {
        let layer = sky.querySelector(':scope > .bg');
        if (bg.mode === 'transparent') {
          if (layer) layer.remove();
        } else {
          if (!layer) { layer = el('div', 'bg'); sky.prepend(layer); }
          layer.className = 'bg' + (bg.mode === 'weather' ? ' photo' : '');
          layer.style.backgroundImage = bg.mode === 'weather' ? `url(sky/${sceneKey}.jpg)` : '';
          layer.style.backgroundColor = bg.mode === 'color' ? bg.color : '';
          layer.style.opacity = String(bg.opacity / 100);
        }
        sky.classList.toggle('ink', effectiveLuminance(bg) > 0.4);
      }

      /** The steps still ahead, by their own times (a kept response can be a run old), up to `minutes` from now. */
      function liveSteps(d, minutes) {
        const nowMs = Date.now();
        return ((d.nextHour && d.nextHour.steps) || []).filter((s) => {
          const at = Date.parse(s.at);
          return at + STEP_MS > nowMs && at <= nowMs + minutes * 60000;
        });
      }

      /** Rain now or within the next `minutes`, by the steps' own times (the 'auto' test of the rain cards). */
      function rainWithin(d, minutes) {
        const n = d.nextHour;
        if (!n || minutesAgo(n.issuedAt) > 60) return false;
        if (n.rainNow) return true;
        return liveSteps(d, minutes).some((s) => s.band && s.band !== 'none');
      }

      /** Does the card have something to say right now? Only asked for cards set to 'auto'. */
      function autoShows(id, d) {
        if (id === 'nextHour') return rainWithin(d, 60);
        if (id === 'nowcast3h') return rainWithin(d, 180);
        if (id === 'warning') return (d.warnings || []).some((w) => ['yellow', 'orange', 'red'].includes(w.level));
        return true;
      }

      function buildCard(id, d, width, show) {
        switch (id) {
          case 'warning': return warningBand(d) || (show === 'always' ? quietWarningBand() : null);
          case 'hero': return heroCard(d);
          case 'metrics': return metricsCard(d);
          case 'nextHour': return nextHourCard(d);
          case 'nowcast3h': return nowcast3hCard(d, width - 28);
          case 'hours': return hoursCard(d, width - 28);
          case 'days': return daysCard(d);
          default: return null;
        }
      }

      // ---- Views ------------------------------------------------------------

      let lastData = null;
      let editing = null; // the layout being edited, or null
      let licenceOpen = false; // the full attribution, on request (the licences ask for the whole line)

      function footer(d) {
        const foot = el('div', 'foot');
        const lic = el('button', 'lic' + (licenceOpen ? ' open' : ''), d.attribution || '');
        lic.type = 'button';
        lic.setAttribute('aria-expanded', String(licenceOpen));
        lic.setAttribute('aria-label', t('licences'));
        lic.addEventListener('click', () => { licenceOpen = !licenceOpen; render(lastData); fit(); });
        foot.append(lic);
        const btn = html('button', 'edit-btn', PENCIL);
        btn.type = 'button';
        btn.setAttribute('aria-label', t('edit'));
        btn.title = t('edit');
        btn.addEventListener('click', () => { editing = normalizeLayout(lastData.layout); render(lastData); fit(); });
        foot.append(btn);
        return foot;
      }

      function render(d) {
        lastData = d;
        pickLanguage(d);
        root.textContent = '';
        if (!d || d.state !== 'ok') {
          document.body.classList.add('is-empty');
          const box = el('div', 'empty');
          const state = d && d.state ? d.state : 'unavailable';
          box.append(el('strong', '', 'MeteoVeo'), document.createTextNode(t(state)));
          root.append(box);
          return;
        }
        document.body.classList.remove('is-empty');
        const width = root.clientWidth || document.documentElement.clientWidth || 360;
        const sky = el('div', 'sky');
        const layout = normalizeLayout(d.layout);
        paintBackground(sky, editing ? editing.background : layout.background, sceneFor(d));
        const wrap = el('div', 'wrap');
        if (editing) {
          wrap.append(editView(d));
        } else {
          for (const c of layout.cards) {
            if (c.show === 'never') continue;
            if (c.show === 'auto' && !autoShows(c.id, d)) continue;
            const node = buildCard(c.id, d, width, c.show);
            if (node) wrap.append(node);
          }
          wrap.append(footer(d));
        }
        sky.append(wrap);
        root.append(sky);
      }

      // ---- Edit mode ----------------------------------------------------------

      function editView(d) {
        const card = el('div', 'card');
        const head = el('div', 'edit-head');
        head.append(el('div', 'title', t('edit_title')), el('div', 'hint', t('edit_hint')));
        card.append(head);
        const rows = el('div', 'rows');
        const msg = el('div', 'edit-msg', '');
        let busy = false;

        function redraw() {
          rows.textContent = '';
          editing.cards.forEach((c, i) => {
            const cond = CARDS[c.id].conditional;
            const row = el('div', 'row' + (c.show === 'never' ? ' off' : '') + (cond ? ' cond' : ''));
            row.dataset.id = c.id;
            const handle = html('button', 'handle', GRIP);
            handle.type = 'button'; handle.setAttribute('aria-label', t('drag'));
            row.append(handle, el('span', 'name', t('card.' + c.id)));
            const arrows = el('div', 'arrows');
            const up = html('button', 'arrow', UP); up.type = 'button'; up.setAttribute('aria-label', t('move_up')); up.disabled = i === 0;
            const down = html('button', 'arrow', DOWN); down.type = 'button'; down.setAttribute('aria-label', t('move_down')); down.disabled = i === editing.cards.length - 1;
            up.addEventListener('click', () => move(i, i - 1));
            down.addEventListener('click', () => move(i, i + 1));
            arrows.append(up, down);
            row.append(arrows);
            if (cond) {
              // Three states, in the app's segment-pill style: always / when there is something / never.
              const seg = el('div', 'seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', t('card.' + c.id));
              for (const show of SHOW_VALUES) {
                const b = el('button', '', show === 'auto' ? t('show.' + c.id + '.auto') : t('show.' + show));
                b.type = 'button'; b.dataset.show = show; b.setAttribute('aria-pressed', String(c.show === show));
                b.addEventListener('click', (ev) => { ev.stopPropagation(); setShow(i, show); });
                seg.append(b);
              }
              row.append(seg);
            } else {
              const sw = el('button', 'switch'); sw.type = 'button'; sw.setAttribute('role', 'switch'); sw.setAttribute('aria-checked', String(c.show !== 'never'));
              sw.setAttribute('aria-label', t('card.' + c.id));
              sw.addEventListener('click', () => setShow(i, c.show === 'never' ? 'always' : 'never'));
              row.append(sw);
            }
            attachDrag(handle, row);
            rows.append(row);
          });
        }

        function move(from, to) {
          if (to < 0 || to >= editing.cards.length || from === to) return;
          const [item] = editing.cards.splice(from, 1);
          editing.cards.splice(to, 0, item);
          haptic();
          msg.textContent = '';
          redraw(); fit();
        }

        function setShow(i, show) {
          const c = editing.cards[i];
          if (c.show === show) return;
          // One card must be 'always', or a dry day without warnings would render an empty widget.
          if (c.show === 'always' && !editing.cards.some((x, j) => j !== i && x.show === 'always')) { msg.textContent = t('at_least_one'); return; }
          c.show = show;
          haptic();
          msg.textContent = '';
          redraw(); fit();
        }

        // Tap to pick up, tap to place. Dragging does not survive the Homey app:
        // its dashboard takes vertical swipes for scrolling and cancels the
        // gesture inside the widget (seen on the owner's phone, 2026-10-23).
        let picked = null;
        function attachDrag(handle, row) {
          const index = () => [...rows.children].indexOf(row);
          handle.addEventListener('click', (ev) => {
            ev.stopPropagation();
            if (busy) return;
            picked = picked === index() ? null : index();
            haptic();
            msg.textContent = picked === null ? '' : t('pick_hint');
            markPicked();
          });
          row.addEventListener('click', (ev) => {
            if (picked === null || busy) return;
            if (ev.target.closest('.switch, .arrow, .seg')) return;
            const to = index();
            const from = picked;
            picked = null;
            if (to === from) { msg.textContent = ''; markPicked(); return; }
            move(from, to);
          });
        }
        function markPicked() {
          [...rows.children].forEach((r, i) => {
            r.classList.toggle('dragging', i === picked);
            r.classList.toggle('drop-target', picked !== null && i !== picked);
          });
        }

        redraw();
        card.append(rows, msg);

        // ---- Fondo: the photo of the moment, a solid colour, or the dashboard through; opacity for the first two.
        const bgSec = el('div', 'bg-sec');
        function repaint() { paintBackground(root.querySelector('.sky'), editing.background, sceneFor(d)); }
        function redrawBg() {
          bgSec.textContent = '';
          bgSec.append(el('div', 'title', t('bg_title')));
          const seg = el('div', 'seg bg-seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', t('bg_title'));
          for (const mode of BACKGROUND_MODES) {
            const b = el('button', '', t('bg.' + mode)); b.type = 'button'; b.dataset.mode = mode;
            b.setAttribute('aria-pressed', String(editing.background.mode === mode));
            b.addEventListener('click', () => { if (editing.background.mode === mode) return; editing.background.mode = mode; haptic(); redrawBg(); repaint(); fit(); });
            seg.append(b);
          }
          bgSec.append(seg);
          if (editing.background.mode === 'color') {
            const row = el('div', 'swatches');
            for (const [hex, nameKey] of SWATCHES) {
              const sw = el('button', 'swatch'); sw.type = 'button'; sw.dataset.color = hex; sw.style.background = hex;
              sw.setAttribute('aria-label', t(nameKey)); sw.setAttribute('aria-pressed', String(editing.background.color === hex));
              sw.addEventListener('click', () => { editing.background.color = hex; haptic(); redrawBg(); repaint(); });
              row.append(sw);
            }
            // The phone's own colour picker, behind a rainbow disc.
            const custom = el('label', 'swatch custom'); custom.title = t('bg_pick');
            const input = el('input'); input.type = 'color'; input.value = editing.background.color; input.setAttribute('aria-label', t('bg_pick'));
            input.addEventListener('input', () => { const c = normalizeColor(input.value); if (!c) return; editing.background.color = c; repaint(); for (const b of row.querySelectorAll('button.swatch')) b.setAttribute('aria-pressed', String(b.dataset.color === c)); });
            input.addEventListener('change', () => haptic());
            custom.append(input);
            row.append(custom);
            bgSec.append(row);
          }
          if (editing.background.mode !== 'transparent') {
            const op = el('div', 'opacity');
            const label = el('span', '', t('bg_opacity'));
            const range = el('input'); range.type = 'range'; range.min = '0'; range.max = '100'; range.step = '5'; range.value = String(editing.background.opacity);
            range.setAttribute('aria-label', t('bg_opacity'));
            const value = el('b', '', editing.background.opacity + ' %');
            range.addEventListener('input', () => { editing.background.opacity = Number(range.value); value.textContent = range.value + ' %'; repaint(); });
            range.addEventListener('change', () => haptic());
            op.append(label, range, value);
            bgSec.append(op);
          }
        }
        redrawBg();
        card.append(bgSec);

        const actions = el('div', 'actions');
        const cancel = el('button', 'btn ghost', t('cancel')); cancel.type = 'button';
        const save = el('button', 'btn primary', t('save')); save.type = 'button';
        cancel.addEventListener('click', () => { if (busy) return; editing = null; render(lastData); fit(); });
        save.addEventListener('click', async () => {
          if (busy) return;
          busy = true; save.disabled = true; cancel.disabled = true;
          try {
            const saved = await Homey.api('PUT', '/layout', { instanceId, cards: editing.cards, background: editing.background });
            lastData.layout = normalizeLayout(saved);
            editing = null;
            haptic();
            render(lastData); fit();
          } catch (err) {
            busy = false; save.disabled = false; cancel.disabled = false;
            msg.textContent = t('save_failed');
          }
        });
        actions.append(cancel, save);
        card.append(actions);
        return card;
      }

      // ---- Loading, height, refresh -------------------------------------------

      let height = 0;
      function fit() {
        const h = Math.ceil(root.getBoundingClientRect().height);
        if (h && h !== height) { height = h; Homey.setHeight(h); }
        return h;
      }

      async function load() {
        if (editing) return; // never redraw under an open edit view
        try {
          render(await Homey.api('GET', '/forecast?device=' + encodeURIComponent(deviceId) + '&instance=' + encodeURIComponent(instanceId)));
        } catch (err) {
          render({ state: 'unavailable', language: lastData && lastData.language });
        }
        fit();
      }

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { if (lastData) { render(lastData); fit(); } }, 120);
      });

      load().finally(() => {
        height = Math.ceil(root.getBoundingClientRect().height) || 560;
        Homey.ready({ height });
      });
      setInterval(load, 60 * 1000);
    }
  </script>
</body>
</html>
