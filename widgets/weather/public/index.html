<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* MeteoVeo home-screen language (Inicio v3, "glass over the sky scene"):
       a sky photo for the current weather, white text on it, and translucent
       glass cards — the same tokens as the Android app (Glass.kt, Theme.kt). */
    :root {
      --mv-cobalt: #2b6fa8; --mv-sky: #7fb6cf; --mv-ochre: #dfa137; --mv-terracotta: #bd4a2b; --mv-ink: #12302b;
      --on-sky: #fff; --on-sky-2: rgba(255,255,255,.82); --on-sky-3: rgba(255,255,255,.62);
      --glass-border: rgba(255,255,255,.18); --pill: rgba(255,255,255,.16);
      --rain-pct: #84d4f2; --temp-line: #f4c08a;
      --band-light: #5fbf98; --band-moderate: #f4d035; --band-heavy: #ef6c00;
      --card-radius: 20px; --pill-radius: 16px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    html, body { margin: 0; padding: 0; }
    body { font-family: var(--font); color: var(--homey-text-color, #222); -webkit-font-smoothing: antialiased; background: transparent; }
    body.is-empty { background: var(--homey-background-color, #fff); }
    .empty { padding: 28px 16px; text-align: center; color: var(--homey-text-color-light, #777); font-size: 15px; line-height: 1.4; }
    .empty strong { display: block; color: var(--homey-text-color, #222); font-size: 17px; margin-bottom: 4px; }

    /* The scene */
    .sky { position: relative; min-height: 100%; background: #1d3350 center 45% / cover no-repeat; color: var(--on-sky); overflow: hidden; }
    .sky::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,20,34,.18) 0%, rgba(10,20,34,.42) 45%, rgba(10,20,34,.78) 100%); pointer-events: none; }
    .wrap { position: relative; padding: 14px 14px 12px; display: grid; gap: 10px; }

    /* Warning band: solid, never glass (the app: readability beats decoration) */
    .warn { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; font-size: 14px; font-weight: 600; }
    .warn .ico { flex: none; width: 18px; height: 18px; }
    .warn .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .warn .when { flex: none; font-weight: 500; opacity: .95; }
    .warn.yellow { background: #f2ce1b; color: #3a2c00; } .warn.yellow .ico { fill: #3a2c00; }
    .warn.orange { background: #e07b17; color: #fff; } .warn.orange .ico { fill: #fff; }
    .warn.red { background: #c92a2a; color: #fff; } .warn.red .ico { fill: #fff; }

    /* Hero */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 7px; font-size: 13px; letter-spacing: -.02em; color: var(--on-sky-2); }
    .brand b { font-weight: 600; }
    .brand svg { width: 20px; height: 20px; }
    .basis { font-size: 11.5px; color: var(--on-sky-2); background: var(--pill); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
    .basis.measured::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5fbf98; margin-right: 6px; vertical-align: 1px; }
    .place { font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .now { display: flex; align-items: center; gap: 14px; margin-top: -2px; }
    .temp { font-size: 58px; font-weight: 300; line-height: 1; letter-spacing: -.03em; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .temp sup { font-size: 24px; font-weight: 400; vertical-align: top; line-height: 1.6; letter-spacing: 0; margin-left: 1px; }
    .hero-icon { flex: none; display: flex; align-items: center; filter: drop-shadow(0 2px 4px rgba(14,52,60,.34)); }
    .cond { min-width: 0; display: grid; gap: 1px; }
    .cond .name { font-size: 15px; font-weight: 600; line-height: 1.2; }
    .cond .mm { font-size: 12.5px; color: var(--on-sky-2); }
    .cond .mm b { color: var(--on-sky); font-weight: 600; }

    .pill { background: var(--pill); border: 1px solid var(--pill); border-radius: var(--pill-radius); padding: 9px 14px; }
    .metrics { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .metric { display: grid; gap: 1px; }
    .metric .l { font-family: var(--mono); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: rgba(255,255,255,.72); }
    .metric .v { font-size: 14px; font-weight: 600; white-space: nowrap; }

    /* Glass cards */
    .card { background: linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.08)); border: 1px solid var(--glass-border); border-radius: var(--card-radius); padding: 12px 14px 12px; -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .card-head .title { font-size: 14px; font-weight: 600; }
    .card-head .meta { font-size: 11px; color: var(--on-sky-3); white-space: nowrap; }

    /* Next hour */
    .headline { font-size: 13.5px; line-height: 1.35; margin: 4px 0 6px; color: var(--on-sky); }
    .headline.rain { font-weight: 600; }
    .bands { display: flex; gap: 3px; height: 26px; align-items: flex-end; margin-top: 2px; }
    .bands span { flex: 1; border-radius: 3px; background: rgba(255,255,255,.16); height: 5px; }
    .bands span.light { background: var(--band-light); height: 11px; }
    .bands span.moderate { background: var(--band-moderate); height: 18px; }
    .bands span.heavy { background: var(--band-heavy); height: 26px; }
    .bands span.model { opacity: .55; }
    .bands span.uncertain { background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgba(0,0,0,.18) 3px 5px); }
    .axis { display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--mono); font-size: 9.5px; color: var(--on-sky-3); }

    /* Hours chart */
    .chart-wrap { margin-top: 4px; }
    .chart { display: block; width: 100%; height: auto; overflow: visible; }
    .chart text { font-family: var(--font); fill: var(--on-sky); }
    .chart .t { font-size: 12px; font-weight: 600; }
    .chart .h { font-size: 11px; fill: var(--on-sky-3); }
    .chart .pp { font-size: 10px; fill: var(--rain-pct); font-weight: 600; }

    /* Days */
    .days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin-top: 8px; text-align: center; }
    .day { display: grid; justify-items: center; gap: 4px; min-width: 0; }
    .day .n { font-size: 12px; color: var(--on-sky-2); white-space: nowrap; }
    .day.today .n { font-weight: 700; color: var(--on-sky); }
    .day .mx { font-size: 14px; font-weight: 600; }
    .day .mn { font-size: 12px; color: var(--on-sky-3); }
    .day .pp { font-size: 11px; font-weight: 600; color: var(--rain-pct); min-height: 13px; }
    .day .ic { filter: drop-shadow(0 1px 2px rgba(14,52,60,.3)); display: flex; }

    .foot { font-size: 9.5px; line-height: 1.35; color: rgba(255,255,255,.55); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    @media (min-width: 440px) {
      .wrap { padding: 16px 16px 14px; gap: 12px; }
      .place { font-size: 28px; }
      .temp { font-size: 66px; }
      .cond .name { font-size: 16px; }
      .day .mx { font-size: 15px; }
    }
  </style>
</head>
<body class="homey-widget-full">
  <div id="root"></div>
  <script src="weather-icons.js"></script>
  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const t = (key, vars) => Homey.__(key, vars);
      const root = document.getElementById('root');
      const settings = Homey.getSettings() || {};
      const deviceId = settings.device && settings.device.id ? settings.device.id : '';
      const compact = settings.layout === 'compact';
      const locale = t('widget.locale') || 'es-ES';
      const STEP_MS = 10 * 60000;

      const LOGO = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" fill="none" aria-hidden="true"><defs><linearGradient id="mvSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b6fa8"></stop><stop offset=".38" stop-color="#7fb6cf"></stop><stop offset=".62" stop-color="#dfa137"></stop><stop offset="1" stop-color="#bd4a2b"></stop></linearGradient><clipPath id="mvDisc"><circle cx="66" cy="66" r="63"></circle></clipPath><radialGradient id="mvCloudMain" cx="36%" cy="24%" r="82%"><stop offset="0" stop-color="#ffffff"></stop><stop offset=".42" stop-color="#f7f1e6"></stop><stop offset=".84" stop-color="#d3d4c3"></stop><stop offset="1" stop-color="#d3d4c3"></stop></radialGradient><radialGradient id="mvCloudSide" cx="34%" cy="26%" r="88%"><stop offset="0" stop-color="#f7f1e6"></stop><stop offset=".6" stop-color="#d3d4c3"></stop><stop offset="1" stop-color="#d3d4c3"></stop></radialGradient><linearGradient id="mvCloudBase" gradientUnits="userSpaceOnUse" x1="20" y1="92" x2="100" y2="104"><stop offset="0" stop-color="#d3d4c3"></stop><stop offset=".5" stop-color="#f7f1e6"></stop><stop offset="1" stop-color="#d3d4c3"></stop></linearGradient><radialGradient id="mvCloudGloss" cx="38%" cy="22%" r="58%"><stop offset="0" stop-color="#ffffff" stop-opacity="1"></stop><stop offset=".55" stop-color="#ffffff" stop-opacity=".45"></stop><stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop></radialGradient></defs><circle cx="66" cy="66" r="63" fill="url(#mvSky)"></circle><g clip-path="url(#mvDisc)"><circle cx="90" cy="38" r="18" fill="#fdf1cf"></circle><ellipse cx="60" cy="104" rx="42" ry="6" fill="#d3d4c3" opacity=".35"></ellipse><circle cx="36" cy="84" r="16" fill="url(#mvCloudSide)"></circle><circle cx="82" cy="82" r="17" fill="url(#mvCloudSide)"></circle><rect x="20" y="84" width="80" height="20" rx="10" fill="url(#mvCloudBase)"></rect><circle cx="58" cy="74" r="22" fill="url(#mvCloudMain)"></circle><path d="M36 68a22 22 0 0 1 21 15 16 16 0 0 0-21-15z" fill="#d3d4c3" opacity=".3"></path><path d="M80 65a17 17 0 0 1 19 17 22 22 0 0 0-19-17z" fill="#d3d4c3" opacity=".22"></path><path d="M22 95h76a11 11 0 0 1-11 9H33a11 11 0 0 1-11-9z" fill="#d3d4c3"></path><path d="M27 100h66a11 11 0 0 1-6 4H33a11 11 0 0 1-6-4z" fill="#d3d4c3" opacity=".6"></path><ellipse cx="52" cy="60" rx="15" ry="7.5" fill="url(#mvCloudGloss)"></ellipse><ellipse cx="31" cy="76" rx="7" ry="3.6" fill="#ffffff" opacity=".5"></ellipse><ellipse cx="85" cy="75" rx="7" ry="3.4" fill="#ffffff" opacity=".38"></ellipse><rect x="0" y="110" width="132" height="22" fill="#6c7f4b"></rect></g></svg>';
      const WARN_ICON = '<svg class="ico" viewBox="0 0 24 24"><path d="M12 2.5 1.5 21h21L12 2.5zm0 6 1 7h-2l1-7zm0 9.2a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z"/></svg>';

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      }
      function html(tag, className, markup) {
        const node = el(tag, className);
        node.innerHTML = markup;
        return node;
      }

      const fmtNum = (v, digits) => new Intl.NumberFormat(locale, { minimumFractionDigits: 0, maximumFractionDigits: digits }).format(v);
      const deg = (v) => (v === null || v === undefined ? '—' : Math.round(v) + '°');
      const hhmm = (iso, tz) => new Intl.DateTimeFormat(locale, { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz }).format(new Date(iso));
      const hourOnly = (iso, tz) => new Intl.DateTimeFormat(locale, { hour: '2-digit', hour12: false, timeZone: tz }).format(new Date(iso)).replace(/\D.*$/, '');
      const weekday = (date, tz) => new Intl.DateTimeFormat(locale, { weekday: 'short', timeZone: tz }).format(new Date(date + 'T12:00:00Z')).replace(/\.$/, '');
      const localDate = (iso, tz) => new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: tz }).format(new Date(iso));
      const minutesAgo = (iso) => Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));

      /** The sky scene from the icon key (the web's sky-assets; the same rule as the app's sceneOf). */
      function sceneFor(d) {
        const c = d.current || {};
        const night = c.isDaylight === false;
        if (d.nextHour && d.nextHour.rainNow) return 'eso';
        switch (c.iconKey) {
          case 'napos': return night ? 'ejjel' : 'derult';
          case 'reszben_felhos': return night ? 'ejjel' : 'gomoly';
          case 'fatyolfelhos': return night ? 'ejjel' : 'fatyol';
          case 'borult': case 'kod': return 'borult';
          case 'eso': case 'zapor': case 'havazas': return 'eso';
          case 'szemerkel': return night ? 'eso' : 'gyengen';
          case 'zivatar': return 'zivatar';
          default: return night ? 'ejjel' : 'gomoly';
        }
      }

      function timeWords(iso, d, fromKey, untilKey, isFrom) {
        const today = localDate(new Date().toISOString(), d.timezone);
        const sameDay = localDate(iso, d.timezone) === today;
        const time = hhmm(iso, d.timezone);
        if (sameDay) return t(isFrom ? fromKey : untilKey, { time });
        return t((isFrom ? fromKey : untilKey) + '_day', { time, day: weekday(localDate(iso, d.timezone), d.timezone) });
      }

      function headline(d) {
        const n = d.nextHour;
        if (!n) return { text: t('widget.no_nowcast'), rain: false };
        if (minutesAgo(n.issuedAt) > 60) return { text: t('widget.stale'), rain: false };
        if (n.rainNow && n.rainEndsAt) return { text: t('widget.rain_until', { time: hhmm(n.rainEndsAt, d.timezone) }), rain: true };
        if (n.rainNow) return { text: t('widget.rain_now'), rain: true };
        if (n.rainStartsAt) return { text: t('widget.rain_from', { time: hhmm(n.rainStartsAt, d.timezone) }), rain: true };
        return { text: t('widget.dry'), rain: false };
      }

      function leadLabel(atMs, nowMs) {
        const m = Math.max(0, Math.round((atMs - nowMs) / 60000 / 5) * 5);
        if (m === 0) return t('widget.now');
        return m % 60 === 0 ? '+' + (m / 60) + ' h' : '+' + m + ' min';
      }

      function warningBand(d) {
        const order = { yellow: 1, orange: 2, red: 3 };
        const list = (d.warnings || []).filter((w) => order[w.level]);
        if (!list.length) return null;
        const nowMs = Date.now();
        // The current one first; otherwise the nearest upcoming one (the app's rule).
        const active = list.filter((w) => !w.onset || Date.parse(w.onset) <= nowMs);
        const pool = active.length ? active : list.slice().sort((a, b) => Date.parse(a.onset) - Date.parse(b.onset));
        const w = pool.slice().sort((a, b) => order[b.level] - order[a.level])[0];
        const band = html('div', 'warn ' + w.level, WARN_ICON);
        band.append(el('span', 'what', (w.phenomenonName || w.headline || '') + ' · ' + t('levels.' + w.level).toLowerCase()));
        let when = '';
        if (w.onset && Date.parse(w.onset) > nowMs) when = timeWords(w.onset, d, 'widget.warn_from', 'widget.warn_until', true);
        else if (w.expires) when = timeWords(w.expires, d, 'widget.warn_from', 'widget.warn_until', false);
        if (when) band.append(el('span', 'when', when));
        return band;
      }

      function hero(d) {
        const c = d.current || {};
        const frag = document.createDocumentFragment();
        const top = el('div', 'top');
        top.append(html('div', 'brand', LOGO + '<span>Meteo<b>Veo</b></span>'));
        let basis;
        if (c.basis === 'station' && c.at) {
          const m = minutesAgo(c.at);
          basis = el('span', 'basis measured', m <= 2 ? t('widget.measured_now') : t('widget.measured_ago', { minutes: m }));
        } else {
          basis = el('span', 'basis', t('widget.model_now'));
        }
        top.append(basis);
        frag.append(top);
        frag.append(el('div', 'place', d.place && d.place.name ? d.place.name : d.name));

        const now = el('div', 'now');
        const temp = el('span', 'temp');
        if (c.tempC === null || c.tempC === undefined) temp.textContent = '—';
        else { temp.textContent = fmtNum(c.tempC, 1); temp.append(html('sup', '', '°')); }
        now.append(temp);
        now.append(html('span', 'hero-icon', weatherIconSvg(c.iconKey || 'ismeretlen', 60, c.isDaylight === false)));
        const cond = el('div', 'cond');
        cond.append(el('div', 'name', t('conditions.' + (c.iconKey || 'ismeretlen'))));
        const today = (d.daily || [])[0];
        if (today) {
          cond.append(html('div', 'mm', '<b>' + deg(today.tempMaxC) + '</b> ' + t('widget.max')));
          cond.append(html('div', 'mm', '<b>' + deg(today.tempMinC) + '</b> ' + t('widget.min')));
        }
        now.append(cond);
        frag.append(now);

        const metrics = [];
        if (c.humidityPct !== null && c.humidityPct !== undefined) metrics.push([t('widget.humidity'), Math.round(c.humidityPct) + ' %']);
        // km/h, as in the app and at AEMET (the contract carries m/s).
        if (c.windMs !== null && c.windMs !== undefined) metrics.push([t('widget.wind'), fmtNum(Math.round(c.windMs * 3.6), 0) + ' km/h']);
        if (c.gustMs !== null && c.gustMs !== undefined) metrics.push([t('widget.gust'), fmtNum(Math.round(c.gustMs * 3.6), 0) + ' km/h']);
        if (c.pressureHpa !== null && c.pressureHpa !== undefined) metrics.push([t('widget.pressure'), Math.round(c.pressureHpa) + ' hPa']);
        if (c.precipMm !== null && c.precipMm !== undefined) metrics.push([t('widget.rain'), fmtNum(c.precipMm, 1) + ' mm']);
        if (metrics.length) {
          const bar = el('div', 'pill metrics');
          for (const [l, v] of metrics.slice(0, 4)) {
            const m = el('div', 'metric');
            m.append(el('span', 'l', l), el('span', 'v', v));
            bar.append(m);
          }
          frag.append(bar);
        }
        return frag;
      }

      function nextHourCard(d) {
        const card = el('div', 'card');
        const head = el('div', 'card-head');
        head.append(el('span', 'title', t('widget.next_hour')));
        if (d.nextHour && d.nextHour.issuedAt) {
          // Age from the run time, not ageMinutes: a kept response would show the age it had when fetched.
          head.append(el('span', 'meta', 'MeteoVeo · ' + t('widget.age', { minutes: minutesAgo(d.nextHour.issuedAt) })));
        }
        card.append(head);
        const h = headline(d);
        card.append(el('div', 'headline' + (h.rain ? ' rain' : ''), h.text));

        // By each step's own time: skip the steps already over, show up to two hours.
        const nowMs = Date.now();
        const steps = ((d.nextHour && d.nextHour.steps) || []).filter((s) => {
          const at = Date.parse(s.at);
          return at + STEP_MS > nowMs && at <= nowMs + 120 * 60000;
        });
        if (steps.length) {
          const bar = el('div', 'bands');
          for (const s of steps) {
            const band = s.band || 'none';
            bar.append(el('span', band + (s.source === 'model' ? ' model' : '') + (s.uncertain && band !== 'none' ? ' uncertain' : '')));
          }
          const axis = el('div', 'axis');
          axis.append(el('span', '', t('widget.now')));
          if (steps.length >= 6) axis.append(el('span', '', leadLabel(Date.parse(steps[Math.floor(steps.length / 2)].at), nowMs)));
          if (steps.length >= 3) axis.append(el('span', '', leadLabel(Date.parse(steps[steps.length - 1].at), nowMs)));
          card.append(bar, axis);
        }
        return card;
      }

      function hoursCard(d, width) {
        const hours = (d.hourly || []).filter((h) => h.tempC !== null && h.tempC !== undefined);
        if (hours.length < 2) return null;
        const n = Math.max(6, Math.min(hours.length, Math.floor((width - 30) / 46)));
        const pts = hours.slice(0, n);
        const card = el('div', 'card');
        const head = el('div', 'card-head');
        head.append(el('span', 'title', t('widget.next_hours')), el('span', 'meta', '© AEMET · MeteoVeo'));
        card.append(head);

        const W = width - 30; const H = 100;
        const top = 22; const bottom = 60; // the temperature line lives here
        const temps = pts.map((h) => h.tempC);
        const lo = Math.min(...temps); const hi = Math.max(...temps);
        const span = Math.max(hi - lo, 3);
        const x = (i) => ((i + 0.5) * W) / n;
        const y = (v) => bottom - ((v - lo) / span) * (bottom - top);
        let svg = '';
        const line = pts.map((h, i) => x(i).toFixed(1) + ',' + y(h.tempC).toFixed(1)).join(' ');
        svg += `<polygon points="${x(0).toFixed(1)},${bottom + 6} ${line} ${x(n - 1).toFixed(1)},${bottom + 6}" fill="rgba(255,255,255,.08)"/>`;
        svg += `<polyline points="${line}" fill="none" stroke="var(--temp-line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        pts.forEach((h, i) => {
          const cx = x(i); const cy = y(h.tempC);
          svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.4" fill="#fff" stroke="var(--temp-line)" stroke-width="1.5"/>`;
          svg += `<text class="t" x="${cx.toFixed(1)}" y="${(cy - 8).toFixed(1)}" text-anchor="middle">${Math.round(h.tempC)}°</text>`;
          const p = h.precipProbPct;
          if (p >= 10) {
            const bh = Math.max(3, Math.round((p / 100) * 14));
            svg += `<rect x="${(cx - 5).toFixed(1)}" y="${82 - bh}" width="10" height="${bh}" rx="2" fill="var(--rain-pct)"/>`;
          } else {
            svg += `<rect x="${(cx - 5).toFixed(1)}" y="80" width="10" height="2" rx="1" fill="rgba(255,255,255,.22)"/>`;
          }
          svg += `<text class="h" x="${cx.toFixed(1)}" y="97" text-anchor="middle">${hourOnly(h.at, d.timezone)}</text>`;
        });
        card.append(html('div', 'chart-wrap', `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMidYMid meet">${svg}</svg>`));
        return card;
      }

      function daysCard(d) {
        const days = (d.daily || []).filter((x) => !x.trend).slice(0, 7);
        if (!days.length) return null;
        const card = el('div', 'card');
        const head = el('div', 'card-head');
        head.append(el('span', 'title', t('widget.seven_days')));
        card.append(head);
        const row = el('div', 'days');
        const today = localDate(new Date().toISOString(), d.timezone);
        days.forEach((day, i) => {
          const col = el('div', 'day' + (day.date === today || (i === 0 && day.date < today) ? ' today' : ''));
          col.append(el('span', 'n', day.date === today ? t('widget.today') : weekday(day.date, d.timezone)));
          col.append(html('span', 'ic', weatherIconSvg(day.iconKey || 'ismeretlen', 28, false)));
          col.append(el('span', 'mx', deg(day.tempMaxC)));
          col.append(el('span', 'mn', deg(day.tempMinC)));
          // Like the app's day cells: a chance below 20 % is not a statement worth a number.
          col.append(el('span', 'pp', day.precipProbPct >= 20 ? day.precipProbPct + ' %' : ''));
          row.append(col);
        });
        card.append(row);
        return card;
      }

      let lastData = null;
      function render(d) {
        lastData = d;
        root.textContent = '';
        if (!d || d.state !== 'ok') {
          document.body.classList.add('is-empty');
          const box = el('div', 'empty');
          const state = d && d.state ? d.state : 'unavailable';
          box.append(el('strong', '', 'MeteoVeo'), document.createTextNode(t('widget.' + state)));
          root.append(box);
          return;
        }
        document.body.classList.remove('is-empty');
        const width = root.clientWidth || document.documentElement.clientWidth || 360;
        const sky = el('div', 'sky');
        sky.style.backgroundImage = `url(sky/${sceneFor(d)}.jpg)`;
        const wrap = el('div', 'wrap');
        const band = warningBand(d);
        if (band) wrap.append(band);
        wrap.append(hero(d));
        wrap.append(nextHourCard(d));
        if (!compact) {
          const hours = hoursCard(d, width - 28);
          if (hours) wrap.append(hours);
          const days = daysCard(d);
          if (days) wrap.append(days);
        }
        if (d.attribution) wrap.append(el('div', 'foot', d.attribution));
        sky.append(wrap);
        root.append(sky);
      }

      let height = 0;
      function fit() {
        const h = Math.ceil(root.getBoundingClientRect().height);
        if (h && h !== height) { height = h; Homey.setHeight(h); }
        return h;
      }

      async function load() {
        try {
          render(await Homey.api('GET', '/forecast?device=' + encodeURIComponent(deviceId)));
        } catch (err) {
          render({ state: 'unavailable' });
        }
        fit();
      }

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { if (lastData) { render(lastData); fit(); } }, 120);
      });

      load().finally(() => {
        height = Math.ceil(root.getBoundingClientRect().height) || 560;
        Homey.ready({ height });
      });
      setInterval(load, 60 * 1000);
    }
  </script>
</body>
</html>
